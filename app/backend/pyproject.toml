[project]
name = "scenetalk-backend"
version = "0.1.0"
description = "SceneTalk FastAPI backend — Gemini 4 Argon Planner/Director/Verifier + Gemini 3.8 Live Bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "google-genai==2.31.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
